<!-- ============================================================== -->
<!-- toggle and nav items -->
<!-- ============================================================== -->
<ul class="navbar-nav float-start me-auto" *ngFor="let item of navbarItems">
  <li class="nav-item">
    <a class="nav-link waves-effect waves-dark" href="{{item.url}}">{{item.title}}</a>
  </li>
  <!-- ============================================================== -->
  <!-- create new -->
  <!-- ============================================================== -->
</ul>
<!-- ============================================================== -->
<!-- Right side toggle and nav items -->
<!-- ============================================================== -->
<ul class="navbar-nav float-end">
 <!-- Mostrar si el usuario NO está logueado -->
 <ng-container *ngIf="!user; else loggedInTemplate">
  <li class="nav-item">
    <a class="nav-link waves-effect waves-dark">
      <button class="btn btn-outline-success" (click)="signIn()">Iniciar Sesion</button>
    </a>
  </li>
  <li class="nav-item">
    <a class="nav-link waves-effect waves-dark">
      <button class="btn btn-outline-secondary" (click)="signUp()">Registrarse</button>
    </a>
  </li>
</ng-container>

<!-- Template a mostrar si el usuario SÍ está logueado -->
<ng-template #loggedInTemplate>
  <li class="nav-item" ngbDropdown placement="bottom-end">
    <a
      ngbDropdownToggle
      class="nav-link waves-effect waves-dark pro-pic"
      href="javascript:void(0)"
      data-toggle="dropdown"
      aria-haspopup="true"
      aria-expanded="false"
    >
      <img
        src="assets/images/users/user4.jpg"
        alt="user"
        class="rounded-circle"
        width="100"
      />
      <span class="ms-2"><strong>{{user!.name}} {{user!.last_name}}</strong></span>
    </a>
    <div class="dropdown-menu-right" ngbDropdownMenu>
      <a class="dropdown-item" href="javascript:void(0)">Ver Mi Historial</a>
      <div class="dropdown-divider"></div>
      <a class="dropdown-item" href="javascript:void(0)" (click)="logout()">Cerrar sesión</a>
    </div>
  </li>
</ng-template>
</ul>
